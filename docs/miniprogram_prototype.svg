<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2240" viewBox="0 0 1440 2240">
  <defs>
    <style>
      .bg { fill: #F7F4EC; }
      .ink { fill: #080806; }
      .copy { fill: #433E34; }
      .muted { fill: #8A8172; }
      .moss { fill: #586B3F; }
      .sprout { fill: #A6B77A; }
      .clay { fill: #B67855; }
      .line { stroke: #E8E0D0; }
      .surface { fill: #FFFFFF; }
