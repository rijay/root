      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #080806; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #8A8172; }
      .screen-title { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #080806; }
      .h1 { font: 800 24px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #080806; }
      .h1-light { font: 800 24px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #FDFBF6; }
      .h2 { font: 700 17px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #080806; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #8A8172; }
      .small-dark { font: 500 13px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #433E34; }
      .small-light { font: 500 13px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #FDFBF6; }
      .label { font: 700 12px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #586B3F; }
      .button-text { font: 700 15px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #FFFFFF; }
      .secondary-text { font: 700 15px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #586B3F; }
      .nav { font: 600 12px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #8A8172; }
      .flow { fill: none; stroke: #586B3F; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
